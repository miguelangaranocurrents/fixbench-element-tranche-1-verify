name: e2e

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes

jobs:
    e2e:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  cache: "pnpm"
                  node-version: "lts/*"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Copy config
              working-directory: apps/web
              run: cp element.io/develop/config.json config.json

            - name: Build
              working-directory: apps/web
              env:
                  CI_PACKAGE: true
              run: pnpm run build

            - name: Install Playwright browsers
              run: pnpm playwright install --with-deps chromium

            - name: Run e2e tests
              working-directory: apps/web
              run: >-
                  pnpm test:playwright --project=Chrome
                  playwright/e2e/editing/
                  playwright/e2e/threads/
                  playwright/e2e/composer/
                  playwright/e2e/regression-tests/
                  playwright/e2e/messages/
                  playwright/e2e/timeline/

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: playwright-report
                  path: |
                      apps/web/playwright/html-report/
                      apps/web/playwright/test-results/
                      apps/web/test-results.json
                  retention-days: 30

            - name: Upload test results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: test-results
                  path: apps/web/test-results.json
                  retention-days: 30
